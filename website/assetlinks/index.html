<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAFU Asset Links</title>
<meta name="description" content="SAFU asset links: pitch deck, project overview, 1-pager, architecture diagram, and demo video.">
<meta property="og:title" content="SAFU Asset Links">
<meta property="og:description" content="Pitch deck, project overview, 1-pager, architecture diagram, and demo video.">
<meta property="og:type" content="website">
<!-- Favicon built from the REAL brand mark, not safu-favicon.svg. That SVG is the
     Arial Black hand-rebuilt approximation retired from the deck and diagram on
     2026-08-04; the real mark's "A" is a chevron with no crossbar. -->
<link rel="icon" type="image/png" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Palette taken verbatim from the locked grant deck and 1-pager so this page and the
     assets it opens read as one set. */
  :root {
    --brand-primary: #FF3B3B;
    --text: #14171A;
    --text-muted: #5B6169;
    --bg: #FAFAFA;
    --bg-page: #EDEAE7;
    --bg-accent: #F5E9E7;
    --proof-green: #1B8A5A;
    --border: #E7E2DF;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg-page);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 48px 20px 40px;
  }

  .wrap { width: 100%; max-width: 460px; }

  /* header */
  .head { text-align: center; margin-bottom: 34px; }

  .mark {
    width: 56px; height: 56px;
    margin: 0 auto 16px;
    display: block;
  }

  .wordmark {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .cat {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-top: 9px;
  }

  /* section labels */
  .section-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 0 12px 2px;
  }
  .section-label .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--brand-primary);
    flex-shrink: 0;
  }

  .group { margin-bottom: 30px; }
  .group:last-of-type { margin-bottom: 0; }

  /* buttons */
  .btn {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-left: 3px solid var(--brand-primary);
    padding: 15px 16px;
    margin-bottom: 10px;
    text-decoration: none;
    color: var(--text);
    font-size: 15px;
    font-weight: 600;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }
  .btn:last-child { margin-bottom: 0; }

  .btn:hover, .btn:focus-visible {
    background: var(--bg-accent);
    border-color: var(--brand-primary);
    border-left-color: var(--brand-primary);
    transform: translateY(-1px);
  }
  .btn:focus-visible {
    outline: 2px solid var(--brand-primary);
    outline-offset: 2px;
  }

  .btn .label { flex: 1; }

  .chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9.5px;
    font-weight: 500;
    letter-spacing: 0.09em;
    color: var(--text-muted);
    border: 1px solid var(--border);
    padding: 3px 6px;
    flex-shrink: 0;
  }

  .arrow {
    font-size: 14px;
    color: var(--text-muted);
    flex-shrink: 0;
    line-height: 1;
  }
  .btn:hover .arrow, .btn:focus-visible .arrow { color: var(--brand-primary); }

  /* footer */
  .foot {
    margin-top: 36px;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--text-muted);
  }

  @media (max-width: 400px) {
    body { padding: 34px 16px 30px; }
    .wordmark { font-size: 26px; }
    .btn { font-size: 14px; padding: 14px 13px; gap: 10px; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="head">
    <img class="mark" src="/logo.png" alt="SAFU">
    <div class="wordmark">SAFU</div>
    <div class="cat">Deterministic loss-socialization protocol</div>
  </header>

  <section class="group" aria-labelledby="lbl-channels">
    <div class="section-label" id="lbl-channels"><span class="dot"></span>Channels</div>

    <a class="btn" href="https://safustaking.com" target="_blank" rel="noopener noreferrer">
      <span class="label">Website</span>
      <span class="arrow" aria-hidden="true">&#8599;</span>
    </a>

    <a class="btn" href="https://x.com/safu_staking" target="_blank" rel="noopener noreferrer">
      <span class="label">X</span>
      <span class="arrow" aria-hidden="true">&#8599;</span>
    </a>

    <a class="btn" href="https://github.com/mrkanchwala/safu-soroban" target="_blank" rel="noopener noreferrer">
      <span class="label">GitHub</span>
      <span class="arrow" aria-hidden="true">&#8599;</span>
    </a>
  </section>

  <section class="group" aria-labelledby="lbl-assets">
    <div class="section-label" id="lbl-assets"><span class="dot"></span>Assets</div>

    <a class="btn" href="https://safustaking.com/assets/safu-grant-deck.pdf" target="_blank" rel="noopener noreferrer">
      <span class="label">Pitch deck</span>
      <span class="chip">PDF</span>
      <span class="arrow" aria-hidden="true">&#8599;</span>
    </a>

    <a class="btn" href="https://docs.google.com/document/d/1P857SaA5D0gVrf-a-mOcf7R4HpvWJ8VZ-47Jxtb6XAA" target="_blank" rel="noopener noreferrer">
      <span class="label">Project overview</span>
      <span class="chip">DOC</span>
      <span class="arrow" aria-hidden="true">&#8599;</span>
    </a>

    <a class="btn" href="https://safustaking.com/assets/safu-1-pager.pdf" target="_blank" rel="noopener noreferrer">
      <span class="label">1-pager</span>
      <span class="chip">PDF</span>
      <span class="arrow" aria-hidden="true">&#8599;</span>
    </a>

    <a class="btn" href="https://safustaking.com/assets/safu-architecture-diagram.pdf" target="_blank" rel="noopener noreferrer">
      <span class="label">Architecture diagram</span>
      <span class="chip">PDF</span>
      <span class="arrow" aria-hidden="true">&#8599;</span>
    </a>

    <a class="btn" href="https://safustaking.com/videos/safu-demo.mp4" target="_blank" rel="noopener noreferrer">
      <span class="label">Demo video</span>
      <span class="chip">MP4</span>
      <span class="arrow" aria-hidden="true">&#8599;</span>
    </a>

    <a class="btn" href="https://etherscan.io/address/0xa170f0937DEc353C1806eaC0c3d559524d458641" target="_blank" rel="noopener noreferrer">
      <span class="label">Live ETH SAFU Pool</span>
      <span class="chip">ETHERSCAN</span>
      <span class="arrow" aria-hidden="true">&#8599;</span>
    </a>
  </section>

  <div class="foot">safustaking.com</div>

</div>

</body>
</html>
