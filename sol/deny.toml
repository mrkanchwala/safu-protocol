# cargo-deny configuration — SAFUPool (Solana / Anchor)
#
# Added 2026-08-21, during the arrayref/proc-macro1 supply-chain exposure check.
# This project had no dependency gate at all before now, which mattered because
# it is the only SAFU tree that actually contains `arrayref` (0.3.9, transitive
# via `blake3` and `libsecp256k1` — unaffected; the malicious release was 0.3.10).
#
# The point of this file is `yanked = "deny"` below. On 2026-08-20 three widely
# used crates (arrayref 0.3.10, internment 0.8.7, append-only-vec 0.1.9) were
# published with a typosquatted `proc-macro1` dependency whose build script
# fetched a remote payload at compile time, then were yanked within ~90 minutes.
# A yank gate fails the build during that window, before an advisory exists.
#
# Allowlists below were DERIVED from this tree (`cargo deny list`,
# `cargo tree -i <crate> -e no-dev`), not copied from the Soroban repo's config —
# the Solana graph is 369 crates against Soroban's 194 and carries licenses and
# advisories that tree does not. Re-derive the same way when a dependency is
# added; do not widen a list to make an error disappear.

[advisories]
version = 2
yanked = "deny"

ignore = [
    # All five below are `unmaintained` — a maintenance-status advisory, not a
    # vulnerability. None has a known exploit or a patched version to move to.
    # Four of the five are DEV-ONLY, verified per-crate with
    # `cargo tree -i <crate> -e no-dev` returning an empty graph, which means
    # they are absent from the shipped BPF artifact entirely.

    # RUSTSEC-2021-0139 — `ansi_term` unmaintained. DEV-ONLY (test harness via
    # litesvm). Terminal colour formatting; never reachable on-chain.
    "RUSTSEC-2021-0139",

    # RUSTSEC-2024-0388 — `derivative` unmaintained. DEV-ONLY (litesvm).
    # A derive macro: compile-time only, emits no runtime code.
    "RUSTSEC-2024-0388",

    # RUSTSEC-2024-0436 — `paste` unmaintained. DEV-ONLY here (litesvm), unlike
    # the Soroban repo where it arrives under soroban-sdk. Proc-macro, so
    # compile-time only in both cases.
    "RUSTSEC-2024-0436",

    # RUSTSEC-2025-0141 — `bincode` 1.3.3 unmaintained. This one is a REAL
    # RUNTIME dependency, not dev-only: anchor-lang 1.0.2 and
    # solana-instruction 3.4.0 both pull it. Accepted because it cannot be
    # dropped without dropping Anchor, and "unmaintained" here means the 1.x
    # line is frozen in favour of bincode 2.x, not that a defect exists.
    # Revisit when Anchor moves to bincode 2.x. This is the one entry in this
    # list to re-examine if it ever gains a real CVE.
    "RUSTSEC-2025-0141",

    # RUSTSEC-2025-0161 — `libsecp256k1` unmaintained. DEV-ONLY (litesvm).
    # Note this is the crate that transitively carries `arrayref`; the pinned
    # 0.3.9 is unaffected by RUSTSEC-2026-0260 and there is no patched release
    # to move to (`patched = []`). Do not run `cargo update` to "fix" it.
    "RUSTSEC-2025-0161",
]

[licenses]
version = 2

# Every license present in this tree as of 2026-08-21. All permissive; no
# copyleft (GPL/AGPL/LGPL) appears anywhere, which matters for a program that
# ships as a compiled BPF artifact.
allow = [
    "Apache-2.0",
    # `wasi` carries this. SPDX treats `WITH <exception>` as distinct from the
    # bare license, so it must be allowed explicitly even though the exception
    # only grants ADDITIONAL permission.
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-3-Clause",
    # `tiny-keccak` — public-domain dedication, more permissive than MIT.
    # Present in this tree but not the Soroban one.
    "CC0-1.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# `safu-sol` is OUR crate and carries `license = "BUSL-1.1"` in its Cargo.toml.
# BUSL-1.1 is source-available, not OSI-approved, so it is deliberately NOT in
# the allow list above — a scoped exception instead, so that if BUSL-1.1 ever
# turns up in a third-party DEPENDENCY the gate still fails. Unlike the Soroban
# repo's `[licenses.private] ignore = true`, that mechanism does not apply here:
# it only covers crates marked `publish = false`, and safu-sol is not.
[[licenses.exceptions]]
name = "safu-sol"
allow = ["BUSL-1.1"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
